title: Portfolio-bySacha
email: your-email@example.com
description: >-
  Personal portfolio site by Sacha. Showcasing projects, blogs, and more.

baseurl: "/Portfolio-bySacha" # GitHub Pages subpath
url: "https://Hosana-Sacha.github.io" # Replace with your actual GitHub username

# Author info
author:
  name: Sacha Hosana
  email: hosanasacha@gmail.com

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Using local theme files, so disable the gem
# theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-assets

# Sass settings
sass:
  sass_dir: _sass
  style: compressed

# Custom collections (e.g., for project pages)
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Include and exclude settings
include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Default layouts
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
  - scope:
      path: ""
      type: "projects"
    values:
      layout: project
  - scope:
      path: ""
      type: "pages"
    values:
      layout: page

# Social media (optional, useful later for SEO)
twitter_username: jekyllrb
github_username: yourusername

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/
