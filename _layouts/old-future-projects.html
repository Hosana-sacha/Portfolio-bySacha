---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/custom.css">
  <style>
    body {
      font-family: sans-serif;
      background: #f6f0ea;
      color: #1a1a1a;
      padding: 1.5rem;
      max-width: 800px;
      margin: auto;
    }

    .post-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .post-header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    .post-header .date {
      font-size: 0.9rem;
      color: #555;
    }

    .tags {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem;
    }

    .tag {
      background-color: #f4a261;
      color: black;
      font-style: italic;
      padding: 0.25rem 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .hero-image {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 2rem;
      display: block;
    }

    .post-content {
      line-height: 1.7;
      font-size: 1.05rem;
      word-wrap: break-word;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .post-header h1 {
        font-size: 1.6rem;
      }

      .post-content {
        font-size: 1rem;
      }

      .hero-image {
        max-height: 220px;
      }
    }
  </style>
</head>
<body>
  {% include header.html %}
  <article>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      {% if page.tags %}
        <div class="tags">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </div>
      {% endif %}
    </header>

    {% if page.image %}
      <img src="{{ page.image }}" alt="Post Image" class="hero-image">
    {% endif %}

    <section class="post-content">
      {{ content }}
    </section>
  </article>
</body>
</html>
